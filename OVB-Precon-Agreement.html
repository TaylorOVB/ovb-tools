<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="OVB Tools" />
  <meta name="theme-color" content="#1A1F2E" />
  <link rel="apple-touch-icon" href="https://cdn.prod.website-files.com/680c4e282fbc1c583a3a7cc2/69a4a9e940d2f6303215cd3e_OVBear%20(1).png" />
  <title>Precon Agreement — OVB Tools</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #1E1C1A;
      color: #F7F7F7;
      height: 100vh;
      overflow: hidden;
    }

    /* ===================== */
    /*        LAYOUT         */
    /* ===================== */

    #root { height: 100vh; display: flex; flex-direction: column; }

    .tool-header {
      background: #141210;
      border-bottom: 1px solid rgba(199,170,139,0.12);
      padding: 11px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .tool-header-title {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #C7AA8B;
    }
    .tool-header-badge {
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      padding: 3px 8px;
      border-radius: 4px;
      background: rgba(199,170,139,0.1);
      border: 1px solid rgba(199,170,139,0.2);
      color: rgba(199,170,139,0.7);
      letter-spacing: 0.08em;
    }
    .tool-header-sub {
      margin-left: auto;
      font-size: 11px;
      color: rgba(247,247,247,0.2);
      font-family: 'DM Mono', monospace;
      font-size: 10px;
    }

    .tool-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ===================== */
    /*       FORM PANEL      */
    /* ===================== */

    .form-panel {
      width: 380px;
      min-width: 380px;
      background: #1E1C1A;
      overflow-y: auto;
      padding: 20px 20px 0;
      border-right: 1px solid rgba(199,170,139,0.1);
    }

    .section-label {
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #C7AA8B;
      margin-bottom: 10px;
      margin-top: 22px;
    }
    .section-label:first-child { margin-top: 0; }

    label {
      display: block;
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(247,247,247,0.38);
      margin-bottom: 4px;
      margin-top: 11px;
    }
    label:first-of-type { margin-top: 0; }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      background: rgba(199,170,139,0.06);
      border: 1px solid rgba(199,170,139,0.15);
      border-radius: 4px;
      color: #F7F7F7;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      padding: 8px 11px;
      outline: none;
      transition: border-color 0.15s;
      -webkit-appearance: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: rgba(199,170,139,0.45);
    }
    select option { background: #2A2826; }
    input::placeholder { color: rgba(247,247,247,0.2); }
    textarea { resize: vertical; min-height: 60px; line-height: 1.5; }

    .money-wrap { position: relative; }
    .money-wrap .currency-sym {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(247,247,247,0.3);
      font-size: 13px;
      pointer-events: none;
      font-family: 'DM Mono', monospace;
    }
    .money-wrap input { padding-left: 20px; }

    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .toggle-group { display: flex; gap: 6px; margin-top: 2px; }
    .toggle-btn {
      flex: 1;
      padding: 8px 10px;
      border-radius: 4px;
      border: 1px solid rgba(199,170,139,0.18);
      background: transparent;
      color: rgba(247,247,247,0.4);
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.15s;
    }
    .toggle-btn.active {
      background: #C7AA8B;
      border-color: #C7AA8B;
      color: #141210;
      font-weight: 600;
    }

    .track-option {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid rgba(199,170,139,0.15);
      border-radius: 4px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: all 0.15s;
      user-select: none;
    }
    .track-option:hover { border-color: rgba(199,170,139,0.35); }
    .track-option.selected {
      border-color: rgba(199,170,139,0.6);
      background: rgba(199,170,139,0.07);
    }
    .track-option input[type="checkbox"] {
      width: 15px;
      height: 15px;
      min-width: 15px;
      accent-color: #C7AA8B;
      margin-top: 2px;
      cursor: pointer;
    }
    .track-label { font-size: 13px; color: #F7F7F7; font-weight: 500; line-height: 1.3; }
    .track-sub { font-size: 10px; color: rgba(247,247,247,0.35); font-family: 'DM Mono', monospace; margin-top: 2px; }

    .divider {
      border: none;
      border-top: 1px solid rgba(199,170,139,0.08);
      margin: 18px 0 0;
    }

    .info-note {
      background: rgba(199,170,139,0.06);
      border: 1px solid rgba(199,170,139,0.13);
      border-radius: 4px;
      padding: 8px 11px;
      font-size: 10px;
      color: rgba(247,247,247,0.4);
      font-family: 'DM Mono', monospace;
      line-height: 1.6;
      margin-top: 8px;
    }

    /* ===================== */
    /*      BOTTOM BAR       */
    /* ===================== */

    .bottom-bar {
      background: #141210;
      border-top: 1px solid rgba(199,170,139,0.1);
      padding: 13px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .btn-primary {
      background: #C7AA8B;
      color: #141210;
      border: none;
      border-radius: 4px;
      padding: 9px 18px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
      white-space: nowrap;
    }
    .btn-primary:hover { opacity: 0.85; }
    .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; }

    .btn-outline {
      background: transparent;
      color: #C7AA8B;
      border: 1px solid rgba(199,170,139,0.5);
      border-radius: 4px;
      padding: 9px 18px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .btn-outline:hover { background: rgba(199,170,139,0.08); }
    .btn-outline:disabled { opacity: 0.35; cursor: not-allowed; }

    .push-status {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      padding: 5px 11px;
      border-radius: 4px;
      line-height: 1.5;
    }
    .push-ok  { background: rgba(100,200,120,0.08); color: #6DC87A; border: 1px solid rgba(100,200,120,0.2); }
    .push-err { background: rgba(212,113,74,0.08);  color: #D4714A; border: 1px solid rgba(212,113,74,0.2); }

    .bottom-branding {
      margin-left: auto;
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      color: rgba(247,247,247,0.15);
      letter-spacing: 0.08em;
    }

    /* ======================== */
    /*     DOCUMENT PANEL       */
    /* ======================== */

    .doc-panel {
      flex: 1;
      overflow-y: auto;
      background: #E8E4DE;
      padding: 28px;
    }

    /* ======================== */
    /*    DOCUMENT SHEET        */
    /* ======================== */

    .document-sheet {
      background: #fff;
      max-width: 720px;
      margin: 0 auto;
      padding: 52px 56px 56px;
      font-family: 'DM Sans', sans-serif;
      color: #1E1C1A;
      box-shadow: 0 2px 20px rgba(0,0,0,0.14), 0 1px 4px rgba(0,0,0,0.1);
    }

    /* Logo bar */
    .doc-logo-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-bottom: 20px;
      border-bottom: 2px solid #1E1C1A;
      margin-bottom: 26px;
    }
    .doc-company-info {
      text-align: right;
      font-size: 10.5px;
      color: #888;
      line-height: 1.75;
      font-family: 'DM Mono', monospace;
    }

    /* Title block */
    .doc-title {
      font-size: 17px;
      font-weight: 700;
      color: #1E1C1A;
      letter-spacing: -0.01em;
      margin-bottom: 3px;
    }
    .doc-subtitle {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #C7AA8B;
      margin-bottom: 22px;
    }

    /* Meta grid */
    .doc-meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0;
      border: 1px solid #E8E4DF;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 28px;
    }
    .doc-meta-item {
      padding: 11px 14px;
      border-right: 1px solid #E8E4DF;
      border-bottom: 1px solid #E8E4DF;
    }
    .doc-meta-item:nth-child(3n) { border-right: none; }
    .doc-meta-item:nth-last-child(-n+3) { border-bottom: none; }
    .doc-meta-label {
      font-family: 'DM Mono', monospace;
      font-size: 8px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #aaa;
      margin-bottom: 3px;
    }
    .doc-meta-value {
      font-size: 12px;
      color: #1E1C1A;
      font-weight: 500;
      line-height: 1.3;
    }
    .doc-meta-value.accent { color: #C7AA8B; font-weight: 700; font-family: 'DM Mono', monospace; }
    .doc-meta-empty { color: #ccc; font-style: italic; font-weight: 400; }

    /* Sections */
    .doc-section { margin-bottom: 22px; }

    .doc-section-header {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 10px;
      padding-bottom: 7px;
      border-bottom: 1px solid #ECEAE6;
    }
    .doc-section-num {
      background: #1E1C1A;
      color: #C7AA8B;
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-weight: 500;
    }
    .doc-section-title {
      font-size: 11px;
      font-weight: 700;
      color: #1E1C1A;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .doc-body {
      font-size: 12px;
      line-height: 1.8;
      color: #3A3835;
    }
    .doc-body p { margin-bottom: 7px; }
    .doc-body p:last-child { margin-bottom: 0; }
    .doc-body ul { padding-left: 16px; margin: 5px 0; }
    .doc-body ul li { margin-bottom: 3px; }
    .doc-body strong { color: #1E1C1A; font-weight: 600; }

    .doc-track-block { margin-bottom: 12px; }
    .doc-track-block:last-child { margin-bottom: 0; }
    .doc-track-name {
      font-weight: 700;
      color: #1E1C1A;
      font-size: 12px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .doc-track-name::before {
      content: '';
      display: inline-block;
      width: 10px;
      height: 2px;
      background: #C7AA8B;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .doc-highlight {
      background: #FBF8F3;
      border-left: 3px solid #C7AA8B;
      padding: 11px 14px;
      border-radius: 0 4px 4px 0;
      margin: 10px 0;
      font-size: 12px;
      line-height: 1.75;
      color: #1E1C1A;
    }

    /* Fee table */
    .doc-fee-table {
      width: 100%;
      border-collapse: collapse;
      margin: 10px 0;
      font-size: 12px;
    }
    .doc-fee-table th {
      background: #F5F3F0;
      text-align: left;
      padding: 7px 12px;
      font-family: 'DM Mono', monospace;
      font-size: 8px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #aaa;
      border-bottom: 1px solid #E8E4DF;
    }
    .doc-fee-table th:last-child { text-align: right; }
    .doc-fee-table td {
      padding: 10px 12px;
      border-bottom: 1px solid #F0EDE8;
      color: #1E1C1A;
      vertical-align: top;
    }
    .doc-fee-table td.amount {
      text-align: right;
      font-weight: 600;
      font-family: 'DM Mono', monospace;
      white-space: nowrap;
    }
    .doc-fee-table tr.total-row td {
      border-top: 1.5px solid #1E1C1A;
      border-bottom: none;
      font-weight: 700;
    }
    .doc-fee-table .muted { color: #999; font-size: 11px; }

    /* Signature block */
    .sig-block {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      margin-top: 28px;
      padding-top: 22px;
      border-top: 1px solid #E8E4DF;
    }
    .sig-party-label {
      font-family: 'DM Mono', monospace;
      font-size: 8px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #aaa;
      margin-bottom: 28px;
    }
    .sig-line {
      border-bottom: 1px solid #1E1C1A;
      height: 36px;
      margin-bottom: 5px;
    }
    .sig-name-label { font-size: 10.5px; color: #666; margin-bottom: 18px; }
    .sig-field-row { display: flex; gap: 16px; }
    .sig-field { flex: 1; }
    .sig-field-line { border-bottom: 1px solid #1E1C1A; height: 32px; margin-bottom: 4px; }
    .sig-field-label { font-family: 'DM Mono', monospace; font-size: 8px; letter-spacing: 0.1em; text-transform: uppercase; color: #aaa; }

    .doc-footer {
      margin-top: 28px;
      padding-top: 14px;
      border-top: 1px solid #E8E4DF;
      text-align: center;
      font-family: 'DM Mono', monospace;
      font-size: 8.5px;
      letter-spacing: 0.08em;
      color: #bbb;
      line-height: 1.7;
    }

    .empty-hint { color: #ccc; font-style: italic; }

    /* ======================== */
    /*         PRINT            */
    /* ======================== */
    @media print {
      body { background: white !important; overflow: visible !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      #root { height: auto !important; }
      .tool-layout { display: block !important; }
      .form-panel, .tool-header, .bottom-bar { display: none !important; }
      .doc-panel { padding: 0 !important; background: white !important; overflow: visible !important; }
      .document-sheet { box-shadow: none !important; max-width: 100% !important; padding: 0 !important; }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">

  // ── JobTread config ─────────────────────────────────────────
  // OVB_ORG_ID: match value in OVB-Discovery-Call.html / api/jobtread.js
  const OVB_ORG_ID    = "YOUR_ORG_ID";
  const JT_PROXY      = "/api/jobtread.js";

  // Confirmed custom field IDs
  const FIELD = {
    JOB_STATUS:     "22P93aBUAE5W",   // "Estimating"
    NOTES:          "22PCKJxczTan",
    CONTACT_PHONE:  "22P93aBeTXDg",
    CONTACT_EMAIL:  "22P93aBU4cbB",
    // PROJECT_PHASE: "???",           // TODO: confirm from JT — value "Pre-Construction"
  };

  // ── Helpers ──────────────────────────────────────────────────
  function fmtMoney(n) {
    if (!n || n === '' || isNaN(Number(n))) return '—';
    return '$' + Number(n).toLocaleString('en-US');
  }
  function halfOf(n) {
    if (!n || n === '' || isNaN(Number(n))) return '—';
    return '$' + (Number(n) / 2).toLocaleString('en-US', { minimumFractionDigits: 0 });
  }
  function safe(str) {
    return (str || '').replace(/"/g, "'").replace(/\n/g, '\\n');
  }

  // ── Track definitions ────────────────────────────────────────
  const TRACKS = [
    {
      key: 'trackFeasibility',
      label: 'Feasibility',
      sub: 'Site visit · ROM budget · Go/no-go summary',
      scope: [
        'Site visit and existing conditions documentation',
        'Rough order-of-magnitude (ROM) budget development',
        'Written feasibility summary with go/no-go recommendation',
        'Identification of material risks, code considerations, and project unknowns',
      ],
      deliverables: [
        'ROM budget document',
        'Written feasibility summary memorandum',
        'Risk and unknowns log',
      ],
    },
    {
      key: 'trackAECoord',
      label: 'A&E Coordination',
      sub: 'Plans review · Constructability · Bid coordination',
      scope: [
        "Review of existing architectural and engineering documents",
        "Constructability review with written feedback to the design team",
        "Coordination with Client's architect, engineer, and consultants throughout design development",
        "Preliminary budget development aligned to design documents",
        "Subcontractor solicitation and bid package coordination",
        "Value engineering recommendations",
      ],
      deliverables: [
        'Constructability review memorandum',
        'Preliminary project budget aligned to design documents',
        'Subcontractor bid leveling summary',
      ],
    },
    {
      key: 'trackDesignBuild',
      label: 'Design-Build',
      sub: 'Design team management · Permits · GMP estimate',
      scope: [
        "Assembly and management of OVB's design team (architect, structural engineer, required consultants)",
        "Design phase management from schematic design through permit-ready construction documents",
        "Permit application coordination and submittal management",
        "Development of a GMP or cost-plus construction estimate",
        "Subcontractor pre-qualification, solicitation, and bid leveling",
        "Value engineering and design optimization throughout design development",
      ],
      deliverables: [
        'Design team coordination and phase management',
        'Permit-ready construction documents',
        'GMP or cost-plus construction estimate',
        'Subcontractor bid packages and leveling summary',
      ],
    },
  ];

  // ─────────────────────────────────────────────────────────────
  //                         APP
  // ─────────────────────────────────────────────────────────────
  function App() {
    const todayStr = new Date().toLocaleDateString('en-US', {
      month: 'long', day: 'numeric', year: 'numeric',
    });

    const [customerMode, setCustomerMode] = React.useState('new');
    const [pushing, setPushing]           = React.useState(false);
    const [pushMsg, setPushMsg]           = React.useState(null);

    const [form, setForm] = React.useState({
      clientName:        '',
      clientPhone:       '',
      clientEmail:       '',
      existingRef:       '',
      projectAddress:    '',
      projectType:       'New Construction',
      trackFeasibility:  false,
      trackAECoord:      false,
      trackDesignBuild:  false,
      estimatedBudget:   '',
      preconFee:         '',
      includedHours:     '',
      tmRate:            '',
      agreementDate:     todayStr,
      preconDuration:    '',
    });

    const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

    const activeTracks = TRACKS.filter(t => form[t.key]);
    const trackNames   = activeTracks.map(t => t.label).join(', ');
    const hasAnyTrack  = activeTracks.length > 0;

    // ── JT Push ───────────────────────────────────────────────
    async function handlePushToJT() {
      if (!form.clientName) return;
      setPushing(true);
      setPushMsg(null);

      try {
        let contactId = null;

        // Step 1: Create contact if new customer
        if (customerMode === 'new') {
          const contactMutation = `mutation {
            createContact(input: {
              organizationId: "${OVB_ORG_ID}"
              name: "${safe(form.clientName)}"
              customFieldValues: [
                { customFieldId: "${FIELD.CONTACT_PHONE}", value: "${safe(form.clientPhone)}" }
                { customFieldId: "${FIELD.CONTACT_EMAIL}", value: "${safe(form.clientEmail)}" }
              ]
            }) { id }
          }`;

          const cRes  = await fetch(JT_PROXY, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query: contactMutation }),
          });
          const cData = await cRes.json();
          contactId   = cData?.data?.createContact?.id;
          if (!contactId) throw new Error('Contact creation failed — check JT response');
        }

        // Step 2: Build notes string
        const noteLines = [
          `PRECON AGREEMENT — ${form.agreementDate}`,
          `Track: ${trackNames || 'Not specified'}`,
          `Project Type: ${form.projectType}`,
          `Precon Fee: ${fmtMoney(form.preconFee)} (50/50 payment schedule)`,
          form.estimatedBudget ? `Est. Construction Budget: ${fmtMoney(form.estimatedBudget)}` : '',
          `Duration: ${form.preconDuration || 'TBD'}`,
          form.includedHours ? `Included Hours: ${form.includedHours} hrs · T&M rate: ${fmtMoney(form.tmRate)}/hr after` : '',
          customerMode === 'existing' ? `Existing customer ref: ${form.existingRef}` : '',
        ].filter(Boolean).join('\\n');

        // Step 3: Create job
        const jobName = `${form.clientName} — Precon — ${form.projectAddress || 'TBD'}`;

        const jobMutation = `mutation {
          createJob(input: {
            organizationId: "${OVB_ORG_ID}"
            name: "${safe(jobName)}"
            ${contactId ? `contactId: "${contactId}"` : ''}
            customFieldValues: [
              { customFieldId: "${FIELD.JOB_STATUS}", value: "Estimating" }
              { customFieldId: "${FIELD.NOTES}", value: "${noteLines}" }
            ]
          }) { id }
        }`;

        const jRes  = await fetch(JT_PROXY, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: jobMutation }),
        });
        const jData = await jRes.json();
        const jobId = jData?.data?.createJob?.id;
        if (!jobId) throw new Error('Job creation failed — check JT response');

        const msg = customerMode === 'new'
          ? `Job created in JT with new contact. Set Project Phase → Pre-Construction manually.`
          : `Job created in JT. Link existing customer + set Project Phase → Pre-Construction in JT.`;
        setPushMsg({ ok: true, text: msg });

      } catch (err) {
        setPushMsg({ ok: false, text: err.message || 'Push failed — unknown error' });
      } finally {
        setPushing(false);
      }
    }

    // ── Document sub-components ───────────────────────────────
    function DocMeta({ label, value, accent }) {
      const isEmpty = !value || value === '' || value === '—';
      return (
        <div className="doc-meta-item">
          <div className="doc-meta-label">{label}</div>
          <div className={`doc-meta-value${accent ? ' accent' : ''}${isEmpty ? ' doc-meta-empty' : ''}`}>
            {isEmpty ? '—' : value}
          </div>
        </div>
      );
    }

    function DocSection({ num, title, children }) {
      return (
        <div className="doc-section">
          <div className="doc-section-header">
            <div className="doc-section-num">{num}</div>
            <div className="doc-section-title">{title}</div>
          </div>
          <div className="doc-body">{children}</div>
        </div>
      );
    }

    function ScopeContent() {
      if (!hasAnyTrack) return <p className="empty-hint">Select at least one precon service track.</p>;
      return (
        <div>
          {activeTracks.map((t, i) => (
            <div key={t.key} className="doc-track-block" style={{ marginTop: i > 0 ? 12 : 0 }}>
              <div className="doc-track-name">{t.label}</div>
              <ul>{t.scope.map((s, j) => <li key={j}>{s}</li>)}</ul>
            </div>
          ))}
        </div>
      );
    }

    function DeliverablesContent() {
      if (!hasAnyTrack) return <p className="empty-hint">Select service tracks to populate deliverables.</p>;
      const all = activeTracks.flatMap(t => t.deliverables);
      return <ul>{all.map((d, i) => <li key={i}>{d}</li>)}</ul>;
    }

    // ── Render ────────────────────────────────────────────────
    return (
      <div style={{ display: 'flex', flexDirection: 'column', height: '100vh' }}>

        {/* Header */}
        <div className="tool-header">
          <div className="tool-header-title">Precon Proposal &amp; Agreement</div>
          <div className="tool-header-badge">PDF · JT Push</div>
          <div className="tool-header-sub">OVB Tools · GC #14219939-5501</div>
        </div>

        <div className="tool-layout">

          {/* ═══════════════════════════════ */}
          {/*            FORM                */}
          {/* ═══════════════════════════════ */}
          <div className="form-panel">

            {/* 01 · CLIENT */}
            <div className="section-label">01 · Client</div>
            <div className="toggle-group">
              <button
                className={`toggle-btn ${customerMode === 'new' ? 'active' : ''}`}
                onClick={() => setCustomerMode('new')}
              >New Customer</button>
              <button
                className={`toggle-btn ${customerMode === 'existing' ? 'active' : ''}`}
                onClick={() => setCustomerMode('existing')}
              >Existing</button>
            </div>

            {customerMode === 'new' ? (
              <>
                <label>Client Name</label>
                <input type="text" value={form.clientName} onChange={e => set('clientName', e.target.value)} placeholder="Full name" />
                <div className="row-2" style={{ marginTop: 11 }}>
                  <div>
                    <label style={{ marginTop: 0 }}>Phone</label>
                    <input type="tel" value={form.clientPhone} onChange={e => set('clientPhone', e.target.value)} placeholder="(385) 000-0000" />
                  </div>
                  <div>
                    <label style={{ marginTop: 0 }}>Email</label>
                    <input type="email" value={form.clientEmail} onChange={e => set('clientEmail', e.target.value)} placeholder="email@domain.com" />
                  </div>
                </div>
              </>
            ) : (
              <>
                <label>Client Name</label>
                <input type="text" value={form.clientName} onChange={e => set('clientName', e.target.value)} placeholder="Full name (for document)" />
                <label>Existing JT Customer Ref</label>
                <input type="text" value={form.existingRef} onChange={e => set('existingRef', e.target.value)} placeholder="Customer name or JT job #" />
                <div className="info-note">JT job will be created — link to existing customer manually in JobTread after push.</div>
              </>
            )}

            <hr className="divider" />

            {/* 02 · PROJECT */}
            <div className="section-label">02 · Project</div>
            <label>Project Address</label>
            <input type="text" value={form.projectAddress} onChange={e => set('projectAddress', e.target.value)} placeholder="Street address" />
            <label>Project Type</label>
            <select value={form.projectType} onChange={e => set('projectType', e.target.value)}>
              <option>New Construction</option>
              <option>Addition</option>
              <option>Remodel</option>
            </select>

            <hr className="divider" />

            {/* 03 · SERVICES */}
            <div className="section-label">03 · Precon Services</div>
            {TRACKS.map(t => (
              <div
                key={t.key}
                className={`track-option ${form[t.key] ? 'selected' : ''}`}
                onClick={() => set(t.key, !form[t.key])}
              >
                <input type="checkbox" checked={form[t.key]} onChange={() => {}} />
                <div>
                  <div className="track-label">{t.label}</div>
                  <div className="track-sub">{t.sub}</div>
                </div>
              </div>
            ))}

            <hr className="divider" />

            {/* 04 · FEES */}
            <div className="section-label">04 · Fees &amp; Time</div>
            <label>Est. Construction Budget (for reference)</label>
            <div className="money-wrap">
              <span className="currency-sym">$</span>
              <input type="number" value={form.estimatedBudget} onChange={e => set('estimatedBudget', e.target.value)} placeholder="0" />
            </div>
            <label>Precon Fee</label>
            <div className="money-wrap">
              <span className="currency-sym">$</span>
              <input type="number" value={form.preconFee} onChange={e => set('preconFee', e.target.value)} placeholder="0" />
            </div>
            <div className="row-2" style={{ marginTop: 11 }}>
              <div>
                <label style={{ marginTop: 0 }}>Included Hours</label>
                <input type="number" value={form.includedHours} onChange={e => set('includedHours', e.target.value)} placeholder="e.g. 20" />
              </div>
              <div>
                <label style={{ marginTop: 0 }}>T&amp;M Rate ($/hr)</label>
                <div className="money-wrap">
                  <span className="currency-sym">$</span>
                  <input type="number" value={form.tmRate} onChange={e => set('tmRate', e.target.value)} placeholder="0" />
                </div>
              </div>
            </div>

            <hr className="divider" />

            {/* 05 · AGREEMENT */}
            <div className="section-label">05 · Agreement</div>
            <label>Agreement Date</label>
            <input type="text" value={form.agreementDate} onChange={e => set('agreementDate', e.target.value)} />
            <label>Estimated Precon Duration</label>
            <input type="text" value={form.preconDuration} onChange={e => set('preconDuration', e.target.value)} placeholder="e.g. 60 days · 8 weeks" />

            <div style={{ height: 80 }} /> {/* scroll buffer */}
          </div>

          {/* ═══════════════════════════════ */}
          {/*           DOCUMENT             */}
          {/* ═══════════════════════════════ */}
          <div className="doc-panel">
            <div className="document-sheet" id="precon-document">

              {/* Logo bar */}
              <div className="doc-logo-bar">
                <img
                  src="https://cdn.prod.website-files.com/680c4e282fbc1c583a3a7cc2/69a217c4cdb0cf7f735453d5_2.png"
                  alt="Ogden Valley Builders"
                  style={{ height: 26 }}
                />
                <div className="doc-company-info">
                  Ogden Valley Builders, LLC<br />
                  GC License #14219939-5501<br />
                  (385) 288-7921 · info@ogdenvalleybuilders.com<br />
                  Weber &amp; Morgan County, Utah
                </div>
              </div>

              {/* Title */}
              <div className="doc-title">Preconstruction Proposal &amp; Services Agreement</div>
              <div className="doc-subtitle">
                {form.projectType || 'Project Type'} &nbsp;·&nbsp; {form.agreementDate}
              </div>

              {/* Meta grid */}
              <div className="doc-meta-grid">
                <DocMeta label="Client" value={form.clientName} />
                <DocMeta label="Project Address" value={form.projectAddress} />
                <DocMeta label="Project Type" value={form.projectType} />
                <DocMeta label="Services Track" value={trackNames || null} />
                <DocMeta label="Precon Fee" value={fmtMoney(form.preconFee)} accent={!!form.preconFee} />
                <DocMeta label="Est. Duration" value={form.preconDuration} />
              </div>

              {/* ── Section 1: Parties ─────────── */}
              <DocSection num="1" title="Parties & Project">
                <p>
                  This Preconstruction Services Agreement ("Agreement") is entered into as of{' '}
                  <strong>{form.agreementDate}</strong> between{' '}
                  <strong>Ogden Valley Builders, LLC</strong> ("OVB"), a Utah limited liability
                  company (GC License #14219939-5501), and{' '}
                  <strong>{form.clientName || '[Client Name]'}</strong> ("Client").
                </p>
                <p>
                  Project: <strong>{form.projectType}</strong> located at{' '}
                  <strong>{form.projectAddress || '[Project Address]'}</strong>. OVB agrees to
                  perform preconstruction services as described herein on behalf of Client in
                  accordance with the terms of this Agreement.
                </p>
                {form.estimatedBudget && (
                  <p>
                    Client's estimated construction budget for reference purposes:{' '}
                    <strong>{fmtMoney(form.estimatedBudget)}</strong>. This figure does not
                    constitute a contractual commitment and is subject to change as preconstruction
                    progresses.
                  </p>
                )}
              </DocSection>

              {/* ── Section 2: Scope ───────────── */}
              <DocSection num="2" title="Scope of Preconstruction Services">
                <ScopeContent />
              </DocSection>

              {/* ── Section 3: Deliverables ────── */}
              <DocSection num="3" title="Deliverables">
                <p>OVB will provide the following written deliverables upon completion of preconstruction services:</p>
                <DeliverablesContent />
                <p style={{ marginTop: 8 }}>
                  All deliverables will be provided in digital format. Physical copies available upon request.
                </p>
              </DocSection>

              {/* ── Section 4: Fee ─────────────── */}
              <DocSection num="4" title="Fee & Payment Schedule">
                <table className="doc-fee-table">
                  <thead>
                    <tr>
                      <th>Description</th>
                      <th>Due</th>
                      <th>Amount</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td>
                        50% deposit — due upon execution
                        <div className="muted">Work commences upon receipt of deposit</div>
                      </td>
                      <td>Upon signing</td>
                      <td className="amount">{halfOf(form.preconFee)}</td>
                    </tr>
                    <tr>
                      <td>50% balance — due upon completion of services</td>
                      <td>Precon complete</td>
                      <td className="amount">{halfOf(form.preconFee)}</td>
                    </tr>
                    <tr className="total-row">
                      <td><strong>Total Preconstruction Fee</strong></td>
                      <td></td>
                      <td className="amount">{fmtMoney(form.preconFee)}</td>
                    </tr>
                  </tbody>
                </table>
                <p>
                  Payment is due within 5 days of each milestone. Overdue balances accrue interest
                  at 1.5% per month. OVB reserves the right to pause services for balances more
                  than 14 days past due.
                </p>
              </DocSection>

              {/* ── Section 5: Credit-to-Contract ─ */}
              <DocSection num="5" title="Credit-to-Contract">
                <div className="doc-highlight">
                  In the event Client proceeds to construction with Ogden Valley Builders under a
                  separate Construction Agreement executed within 12 months of this Agreement,
                  100% of the Precon Fee paid hereunder shall be credited toward OVB's contractor
                  fee on the construction contract.
                </div>
                <p>
                  This credit is non-transferable and applies solely where OVB serves as the
                  general contractor of record for the Project. If Client engages a different
                  general contractor, the credit does not apply and no refund of the Precon Fee
                  is owed. The credit applies to the contractor fee component only and does not
                  offset construction hard costs or subcontractor costs.
                </p>
              </DocSection>

              {/* ── Section 6: T&M ────────────── */}
              <DocSection num="6" title="Time & Materials Overage">
                <p>
                  This Agreement includes up to{' '}
                  <strong>{form.includedHours || '[N]'} hours</strong> of meetings, design reviews,
                  and client coordination ("Included Hours"). Time in excess of the Included Hours
                  allowance will be billed at{' '}
                  <strong>{fmtMoney(form.tmRate)}/hr</strong>, invoiced monthly, and due within
                  14 days of invoice date.
                </p>
                <p>
                  OVB will provide written notice to Client when 80% of the Included Hours
                  allowance has been consumed, giving Client the opportunity to adjust scope or
                  authorize additional time before overage charges begin. OVB will not invoice
                  overage time without prior written notice to Client.
                </p>
              </DocSection>

              {/* ── Section 7: OVB Obligations ── */}
              <DocSection num="7" title="OVB Obligations">
                <ul>
                  <li>Perform all preconstruction services with reasonable professional care and skill</li>
                  <li>Assign a qualified project manager as Client's primary point of contact throughout the engagement</li>
                  <li>Maintain confidentiality of all Client-provided information and project details</li>
                  <li>Deliver written deliverables within agreed timelines and communicate delays promptly</li>
                  <li>Provide written notice when issues arise that may materially affect scope, schedule, or budget</li>
                  <li>Provide written notice at 80% of Included Hours before T&amp;M overage charges commence</li>
                  <li>Disclose material conflicts of interest, if any, before they arise</li>
                </ul>
              </DocSection>

              {/* ── Section 8: Client Obligations ─ */}
              <DocSection num="8" title="Client Obligations">
                <ul>
                  <li>Provide timely access to the property for site visits and existing conditions assessments</li>
                  <li>Furnish existing surveys, soils reports, plans, title reports, or other relevant documents in Client's possession</li>
                  <li>Make timely decisions when OVB requires Client input to proceed with preconstruction services</li>
                  <li>Identify and make available all parties with decision-making authority on the Project</li>
                  <li>Pay preconstruction fees per the schedule set forth in this Agreement</li>
                  <li>Promptly notify OVB of any changes to project scope, budget, timeline, or objectives</li>
                </ul>
              </DocSection>

              {/* ── Section 9: Termination ──────── */}
              <DocSection num="9" title="Termination">
                <p>
                  Either party may terminate this Agreement upon 7 days written notice to the
                  other party. In the event of termination, Client shall pay OVB for all services
                  completed and expenses incurred through the termination date, prorated from the
                  total Precon Fee. The 50% deposit paid upon execution is non-refundable once
                  preconstruction services have commenced.
                </p>
                <p>
                  If Client terminates this Agreement and does not proceed with OVB as general
                  contractor, the credit-to-contract provision does not apply. No additional
                  refund is owed beyond amounts already paid, less the value of services rendered
                  to the termination date.
                </p>
                <p>
                  OVB may terminate this Agreement immediately upon Client's failure to make
                  required payments after 14 days written notice, without waiving OVB's right
                  to collect all fees earned through the termination date.
                </p>
              </DocSection>

              {/* ── Section 10: Signatures ──────── */}
              <DocSection num="10" title="Agreement & Signatures">
                <p>
                  By signing below, both parties agree to the terms of this Preconstruction
                  Services Agreement. This Agreement constitutes the entire understanding between
                  the parties with respect to preconstruction services and supersedes all prior
                  discussions, representations, or oral agreements. Any modifications must be
                  in writing and signed by both parties.
                </p>

                <div className="sig-block">
                  {/* OVB */}
                  <div>
                    <div className="sig-party-label">Ogden Valley Builders, LLC — Contractor</div>
                    <div className="sig-line"></div>
                    <div className="sig-name-label">Taylor Whitesides, Owner</div>
                    <div className="sig-field-row">
                      <div className="sig-field" style={{ flex: '0 0 140px' }}>
                        <div className="sig-field-line"></div>
                        <div className="sig-field-label">Date</div>
                      </div>
                    </div>
                  </div>
                  {/* Client */}
                  <div>
                    <div className="sig-party-label">Client</div>
                    <div className="sig-line"></div>
                    <div className="sig-name-label">{form.clientName || '[Client Name]'}</div>
                    <div className="sig-field-row">
                      <div className="sig-field" style={{ flex: '0 0 140px' }}>
                        <div className="sig-field-line"></div>
                        <div className="sig-field-label">Date</div>
                      </div>
                    </div>
                  </div>
                </div>
              </DocSection>

              {/* Footer */}
              <div className="doc-footer">
                Ogden Valley Builders, LLC · GC License #14219939-5501 · (385) 288-7921 · info@ogdenvalleybuilders.com<br />
                Weber &amp; Morgan County, Utah · 36-Month Warranty Standard · Cost-Plus Open-Book
              </div>

            </div>{/* /document-sheet */}
          </div>{/* /doc-panel */}
        </div>{/* /tool-layout */}

        {/* ═══════════════════════════════ */}
        {/*          BOTTOM BAR            */}
        {/* ═══════════════════════════════ */}
        <div className="bottom-bar">
          <button className="btn-primary" onClick={() => window.print()}>
            Print PDF
          </button>
          <button
            className="btn-outline"
            onClick={handlePushToJT}
            disabled={pushing || !form.clientName}
          >
            {pushing ? 'Pushing...' : 'Push to JobTread'}
          </button>
          {pushMsg && (
            <div className={`push-status ${pushMsg.ok ? 'push-ok' : 'push-err'}`}>
              {pushMsg.text}
            </div>
          )}
          <div className="bottom-branding">OVB Tools · Precon Agreement</div>
        </div>

      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
