    .toggle-btn.active { background: #C7AA8B; border-color: #C7AA8B; color: #141210; font-weight: 600; }
    .info-note { background: rgba(199,170,139,0.06); border: 1px solid rgba(199,170,139,0.13); border-radius: 4px; padding: 8px 11px; font-size: 10px; color: rgba(247,247,247,0.4); font-family: 'DM Mono', monospace; line-height: 1.6; margin-top: 8px; }

    .doc-demo-text strong { color: #D4714A; font-weight: 700; display: block; margin-bottom: 2px; }

    .doc-intro { font-size: 13px; line-height: 1.8; color: #3A3835; margin-bottom: 26px; }

    /* Sections */
    .doc-section { margin-bottom: 24px; }
    .doc-section-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1.5px solid #ECEAE6; }
    .doc-section-num { background: #1E1C1A; color: #C7AA8B; font-family: 'DM Mono', monospace; font-size: 9px; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: 500; }
    .doc-section-title { font-size: 11px; font-weight: 700; color: #1E1C1A; text-transform: uppercase; letter-spacing: 0.1em; }

    .scope-grid { display: flex; flex-direction: column; gap: 7px; }

    .scope-check { width: 16px; height: 16px; min-width: 16px; background: #C7AA8B; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-top: 3px; flex-shrink: 0; }
    .scope-check::after { content: ''; width: 5px; height: 3px; border-left: 1.5px solid #fff; border-bottom: 1.5px solid #fff; transform: rotate(-45deg) translate(0.5px, -0.5px); display: block; }

    .investment-card { background: #F8F6F2; border: 1px solid #EAE6E0; border-radius: 4px; overflow: hidden; }
    .inv-row { display: flex; justify-content: space-between; align-items: center; padding: 11px 16px; border-bottom: 1px solid #EAE6E0; font-size: 12.5px; color: #3A3835; gap: 16px; }
    .inv-row:last-child { border-bottom: none; }
    .inv-row.total { background: #1E1C1A; color: #F7F7F7; font-weight: 700; font-size: 13px; }
    .inv-amount { font-family: 'DM Mono', monospace; font-weight: 600; color: #1E1C1A; font-size: 13px; white-space: nowrap; }
    .inv-row.total .inv-amount { color: #C7AA8B; font-size: 15px; }
    .inv-sub { font-size: 10.5px; color: #999; margin-top: 2px; }
    .credit-callout { background: #F0F7F2; border: 1.5px solid #7DBF8E; border-radius: 4px; padding: 12px 16px; margin-top: 11px; font-size: 12px; line-height: 1.75; color: #1E1C1A; }
    .credit-callout strong { color: #3A8F52; }

    /* Timeline */
    .timeline { display: flex; flex-direction: column; }
    .tl-item { display: flex; gap: 14px; align-items: flex-start; padding-bottom: 13px; }
    .tl-item:last-child { padding-bottom: 0; }
    .tl-left { display: flex; flex-direction: column; align-items: center; }
    .tl-dot { width: 10px; height: 10px; border-radius: 50%; background: #C7AA8B; flex-shrink: 0; margin-top: 4px; }
    .tl-line { width: 1px; background: #E0DCD5; flex: 1; min-height: 16px; margin-top: 4px; }
    .tl-item:last-child .tl-line { display: none; }
    .tl-step { font-size: 12.5px; font-weight: 600; color: #1E1C1A; margin-bottom: 2px; }
    .tl-desc { font-size: 11.5px; color: #888; line-height: 1.5; }

    /* Why OVB */
    .why-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .why-item { background: #F8F6F2; border: 1px solid #EAE6E0; border-radius: 4px; padding: 12px 14px; }
    .why-stat { font-family: 'DM Mono', monospace; font-size: 18px; font-weight: 500; color: #C7AA8B; margin-bottom: 3px; }
    .why-label { font-size: 11px; color: #3A3835; line-height: 1.4; }

    /* CTA */
    .cta-block { background: #1E1C1A; border-radius: 4px; padding: 22px 24px; display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-top: 26px; }
    .cta-headline { font-size: 14px; font-weight: 700; color: #F7F7F7; margin-bottom: 4px; }
    .cta-sub { font-size: 11.5px; color: rgba(247,247,247,0.45); line-height: 1.55; }
    .cta-pill { background: #C7AA8B; color: #141210; border-radius: 4px; padding: 10px 20px; font-weight: 700; font-size: 13px; white-space: nowrap; flex-shrink: 0; }

    /* Footer */
    .doc-footer { border-top: 1px solid #EAE6E0; margin-top: 24px; padding-top: 14px; text-align: center; font-family: 'DM Mono', monospace; font-size: 8.5px; color: #bbb; line-height: 1.8; letter-spacing: 0.06em; }

    /* Print */
    @media print {
      body { background: white !important; overflow: visible !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      #root { height: auto !important; }
      .tool-layout { display: block !important; }
      .form-panel, .tool-header, .bottom-bar { display: none !important; }
      .doc-panel { padding: 0 !important; background: white !important; overflow: visible !important; }
      .doc-sheet { box-shadow: none !important; max-width: 100% !important; }
    }
  </style>
</head>

  function halfOf(n)    { if (!n||n===''||isNaN(Number(n))) return '—'; return '$'+(Number(n)/2).toLocaleString('en-US'); }
  function safe(s)      { return (s||'').replace(/"/g,"'").replace(/\n/g,'\\n'); }
  function today()      { return new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}); }

  function App() {
    const [mode,       setMode]    = React.useState('new');
    const [pushing,    setPushing] = React.useState(false);
    const [pushMsg,    setPushMsg] = React.useState(null);
    const [form, setForm] = React.useState({
      clientName:'', clientPhone:'', clientEmail:'', existingRef:'',
      projectAddress:'', stage:'demo_plans',
      estimatedBudget:'', preconFee:'', includedHours:'', tmRate:'',
      duration:'', proposalDate:today(), notes:'',
    });
    const set = (k,v) => setForm(f=>({...f,[k]:v}));
    const stage       = STAGES[form.stage];
    const isFeasib    = form.stage === 'feasibility';

    async function handlePush() {
      if (!form.clientName) return;
      setPushing(true); setPushMsg(null);
      try {
        let contactId = null;
        if (mode === 'new') {
          const r = await fetch(JT_PROXY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:`mutation{createContact(input:{organizationId:"${OVB_ORG_ID}"name:"${safe(form.clientName)}"customFieldValues:[{customFieldId:"${FIELD.CONTACT_PHONE}"value:"${safe(form.clientPhone)}"}{customFieldId:"${FIELD.CONTACT_EMAIL}"value:"${safe(form.clientEmail)}"}]}){id}}`})});
          const d = await r.json();
          contactId = d?.data?.createContact?.id;
          if (!contactId) throw new Error('Contact creation failed');
        }
        const noteLines = [`PRECON PROPOSAL — ${form.proposalDate}`,`Stage: ${stage.label}`,`Precon Fee: ${fmtMoney(form.preconFee)} (50/50 payment schedule)`,form.estimatedBudget?`Est. Budget: ${fmtMoney(form.estimatedBudget)}`:'',form.duration?`Duration: ${form.duration}`:'',form.includedHours?`Included Hrs: ${form.includedHours} · T&M: ${fmtMoney(form.tmRate)}/hr`:'',form.notes?`Notes: ${form.notes}`:'',mode==='existing'?`Existing ref: ${form.existingRef}`:''].filter(Boolean).join('\\n');
        const jobName = `${form.clientName} — Precon — ${form.projectAddress||'TBD'}`;
        const jr = await fetch(JT_PROXY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:`mutation{createJob(input:{organizationId:"${OVB_ORG_ID}"name:"${safe(jobName)}"${contactId?`contactId:"${contactId}"`:''}customFieldValues:[{customFieldId:"${FIELD.JOB_STATUS}"value:"Estimating"}{customFieldId:"${FIELD.NOTES}"value:"${noteLines}"}]}){id}}`})});
        const jd = await jr.json();
        if (!jd?.data?.createJob?.id) throw new Error('Job creation failed');
        setPushMsg({ok:true,text:'Job created in JT. Set Project Phase → Pre-Construction manually.'});
      } catch(e) { setPushMsg({ok:false,text:e.message||'Push failed'}); }
      finally { setPushing(false); }
    }

    const clientDisplay  = form.clientName      || 'Client Name';
    const addressDisplay = form.projectAddress   || 'Project Address';

    return (
      <div style={{display:'flex',flexDirection:'column',height:'100vh'}}>

        <div className="tool-header">
          <div className="tool-header-title">Precon Proposal</div>
          <div className="tool-header-badge">Sales · PDF · JT Push</div>
          <div className="tool-header-sub">OVB Tools · GC #14219939-5501</div>
        </div>

        <div className="tool-layout">

          {/* ═══ FORM ═══ */}
          <div className="form-panel">
            <div className="section-label">01 · Client</div>
            <div className="toggle-group">
              <button className={`toggle-btn ${mode==='new'?'active':''}`} onClick={()=>setMode('new')}>New Customer</button>
              <button className={`toggle-btn ${mode==='existing'?'active':''}`} onClick={()=>setMode('existing')}>Existing</button>
            </div>
            {mode==='new'?(<>
              <label>Client Name</label>
              <input type="text" value={form.clientName} onChange={e=>set('clientName',e.target.value)} placeholder="Full name" />
              <div className="row-2" style={{marginTop:11}}>
                <div><label>Phone</label><input type="tel" value={form.clientPhone} onChange={e=>set('clientPhone',e.target.value)} placeholder="(385) 000-0000" /></div>
                <div><label>Email</label><input type="email" value={form.clientEmail} onChange={e=>set('clientEmail',e.target.value)} placeholder="email@domain.com" /></div>
              </div>
            </>):(<>
              <label>Client Name</label>
              <input type="text" value={form.clientName} onChange={e=>set('clientName',e.target.value)} placeholder="Full name (for document)" />
              <label>Existing JT Ref</label>
              <input type="text" value={form.existingRef} onChange={e=>set('existingRef',e.target.value)} placeholder="Customer name or JT job #" />
              <div className="info-note">Job will be created — link existing customer in JT after push.</div>
            </>)}

            <hr className="divider" />
            <div className="section-label">02 · Project</div>
            <label>Project Address</label>
            <input type="text" value={form.projectAddress} onChange={e=>set('projectAddress',e.target.value)} placeholder="Street address or city" />
            <label>Where are we starting?</label>
            <select value={form.stage} onChange={e=>set('stage',e.target.value)}>
              {Object.entries(STAGES).map(([k,v])=><option key={k} value={k}>{v.label}</option>)}
            </select>
            {stage.isDemo && (
              <div className="demo-flag">
                <strong>⚠ Demo flag active</strong>
                Pre-1978 structure — hazmat assessment required before demo. Utility disconnects and demo permit included in scope.
              </div>
            )}

            <hr className="divider" />
            <div className="section-label">03 · Fees</div>
            <label>Est. Construction Budget</label>
            <div className="money-wrap"><span className="sym">$</span><input type="number" value={form.estimatedBudget} onChange={e=>set('estimatedBudget',e.target.value)} placeholder="For reference only" /></div>
            <label>Precon Fee</label>
            <div className="money-wrap"><span className="sym">$</span><input type="number" value={form.preconFee} onChange={e=>set('preconFee',e.target.value)} placeholder="0" /></div>
            <div className="fee-hint">{stage.feeHint}</div>
            {!isFeasib&&(<div className="row-2" style={{marginTop:11}}>
              <div><label>Included Hours</label><input type="number" value={form.includedHours} onChange={e=>set('includedHours',e.target.value)} placeholder="e.g. 20" /></div>
              <div><label>T&amp;M Rate $/hr</label><div className="money-wrap"><span className="sym">$</span><input type="number" value={form.tmRate} onChange={e=>set('tmRate',e.target.value)} placeholder="0" /></div></div>
            </div>)}

            <hr className="divider" />
            <div className="section-label">04 · Details</div>
            <label>Proposal Date</label>
            <input type="text" value={form.proposalDate} onChange={e=>set('proposalDate',e.target.value)} />
            <label>Estimated Duration</label>
            <input type="text" value={form.duration} onChange={e=>set('duration',e.target.value)} placeholder="e.g. 6–8 weeks" />
            <label>Internal Notes (JT push only)</label>
            <textarea value={form.notes} onChange={e=>set('notes',e.target.value)} placeholder="Anything to capture in JT..." />
            <div style={{height:80}} />
          </div>

          {/* ═══ DOCUMENT ═══ */}
          <div className="doc-panel">
            <div className="doc-sheet">

              <div className="doc-header-band">
                <div>
                  <div className="doc-proposal-eyebrow">Preconstruction Proposal</div>
                  <div className="doc-proposal-title">{addressDisplay}</div>
                  <div className="doc-proposal-client">Prepared for {clientDisplay} · {form.proposalDate}</div>
                </div>
                <div className="doc-header-right">
                  <img src="https://cdn.prod.website-files.com/680c4e282fbc1c583a3a7cc2/69a217c4cdb0cf7f735453d5_2.png" alt="OVB" />
                  <div className="doc-header-meta">GC #14219939-5501<br />(385) 288-7921<br />Weber &amp; Morgan County, UT</div>
                </div>
              </div>
              <div className="doc-accent-bar"></div>

              <div className="doc-project-strip">
                <div className="doc-project-cell">
                  <div className="doc-cell-label">Client</div>
                  <div className={`doc-cell-value ${!form.clientName?'empty':''}`}>{clientDisplay}</div>
                </div>
                <div className="doc-project-cell">
                  <div className="doc-cell-label">Engagement</div>
                  <div className="doc-cell-value">{stage.label}</div>
                </div>
                <div className="doc-project-cell">
                  <div className="doc-cell-label">Est. Duration</div>
                  <div className={`doc-cell-value ${!form.duration?'empty':''}`}>{form.duration||'—'}</div>
                </div>
              </div>

              <div className="doc-body-wrap">

                {stage.isDemo&&(
                  <div className="doc-demo-callout">
                    <div className="doc-demo-icon">⚠️</div>
                    <div className="doc-demo-text">
                      <strong>Pre-Demolition Notice</strong>
                      Structures built prior to 1978 may contain asbestos and/or lead-based materials. A licensed hazmat assessment is required before demolition can commence. OVB will coordinate assessment referral as part of preconstruction. Utility disconnects and demolition permitting are included in scope.
                    </div>
                  </div>
                )}

                <p className="doc-intro">{stage.intro(form.clientName, form.projectAddress)}</p>

                {/* 1 — What's Included */}
                <div className="doc-section">
                  <div className="doc-section-head">
                    <div className="doc-section-num">1</div>
                    <div className="doc-section-title">What's Included</div>
                  </div>
                  <div className="scope-grid">
                    {stage.scope.map((s,i)=>(
                      <div key={i} className="scope-item">
                        <div className="scope-check"></div>
                        <span>{s}</span>
                      </div>
                    ))}
                  </div>
                </div>

                {/* 2 — Investment */}
                <div className="doc-section">
                  <div className="doc-section-head">
                    <div className="doc-section-num">2</div>
                    <div className="doc-section-title">Your Investment</div>
                  </div>
                  <div className="investment-card">
                    {isFeasib?(
                      <>
                        <div className="inv-row"><div>Feasibility fee — paid in full to begin</div><div className="inv-amount">{fmtMoney(form.preconFee)}</div></div>
                        <div className="inv-row total"><div>Total Preconstruction Fee</div><div className="inv-amount">{fmtMoney(form.preconFee)}</div></div>
                      </>
                    ):(
                      <>
                        <div className="inv-row">
                          <div><div>50% deposit — due upon signing</div><div className="inv-sub">Work begins upon receipt</div></div>
                          <div className="inv-amount">{halfOf(form.preconFee)}</div>
                        </div>
                        <div className="inv-row">
                          <div><div>50% balance — due at precon completion</div><div className="inv-sub">Invoiced when deliverables are complete</div></div>
                          <div className="inv-amount">{halfOf(form.preconFee)}</div>
                        </div>
                        {form.includedHours&&form.tmRate&&(
                          <div className="inv-row">
                            <div><div>Time &amp; materials — if applicable</div><div className="inv-sub">{form.includedHours} hrs included · {fmtMoney(form.tmRate)}/hr after · written notice before overage</div></div>
                            <div className="inv-amount" style={{color:'#bbb',fontSize:11}}>As incurred</div>
                          </div>
                        )}
                        <div className="inv-row total"><div>Total Preconstruction Fee</div><div className="inv-amount">{fmtMoney(form.preconFee)}</div></div>
                      </>
                    )}
                  </div>
                  <div className="credit-callout">
                    <strong>✓ 100% credited toward construction</strong> — If you move forward with OVB as your general contractor, the full preconstruction fee is credited toward our fee on the construction contract. You don't pay twice.
                  </div>
                </div>

                {/* 3 — How It Works */}
                <div className="doc-section">
                  <div className="doc-section-head">
                    <div className="doc-section-num">3</div>
                    <div className="doc-section-title">How It Works</div>
                  </div>
                  <div className="timeline">
                    {stage.timeline.map((t,i)=>(
                      <div key={i} className="tl-item">
                        <div className="tl-left"><div className="tl-dot"></div><div className="tl-line"></div></div>
                        <div className="tl-content">
                          <div className="tl-step">{t.step}</div>
                          <div className="tl-desc">{t.desc}</div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* 4 — Why OVB */}
                <div className="doc-section">
                  <div className="doc-section-head">
                    <div className="doc-section-num">4</div>
                    <div className="doc-section-title">Why Ogden Valley Builders</div>
                  </div>
                  <div className="why-grid">
                    <div className="why-item"><div className="why-stat">36mo</div><div className="why-label">Warranty standard — 3× the Utah requirement</div></div>
                    <div className="why-item"><div className="why-stat">Open</div><div className="why-label">Cost-plus open-book — you see every dollar</div></div>
                    <div className="why-item"><div className="why-stat">Local</div><div className="why-label">Weber &amp; Morgan County — we know your jurisdiction</div></div>
                  </div>
                </div>

                {/* CTA */}
                <div className="cta-block">
                  <div>
                    <div className="cta-headline">Ready to get started?</div>
                    <div className="cta-sub">Sign and return with a 50% deposit of {halfOf(form.preconFee)} to begin.{isFeasib?' Full fee due to begin.':''} A formal construction agreement follows once precon is complete.</div>
                  </div>
                  <div className="cta-pill">Let's Build →</div>
                </div>

                <div className="doc-footer">
                  Ogden Valley Builders, LLC · GC License #14219939-5501 · (385) 288-7921 · info@ogdenvalleybuilders.com<br />
                  Weber &amp; Morgan County, Utah · 36-Month Warranty · Cost-Plus Open-Book Pricing
                </div>

              </div>
            </div>
          </div>
        </div>

        <div className="bottom-bar">
          <button className="btn-primary" onClick={()=>window.print()}>Print PDF</button>
          <button className="btn-outline" onClick={handlePush} disabled={pushing||!form.clientName}>
            {pushing?'Pushing...':'Push to JobTread'}
          </button>
          {pushMsg&&<div className={`push-status ${pushMsg.ok?'push-ok':'push-err'}`}>{pushMsg.text}</div>}
          <div className="bottom-brand">OVB Tools · Precon Proposal</div>
        </div>

      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
