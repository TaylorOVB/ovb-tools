// ─── Date helpers ──────────────────────────────────────────────────────────────
function isWknd(d) { return d.getDay()===0||d.getDay()===6; }
function advWD(d,skip){ const r=new Date(d); if(skip) while(isWknd(r)) r.setDate(r.getDate()+1); return r; }
function addWD(start,days,skip){
  if(days<=1) return new Date(start);
  const d=new Date(start); let added=0;
  while(added<days-1){ d.setDate(d.getDate()+1); if(!skip||!isWknd(d)) added++; }
  return d;
}
function nextWD(end,skip){ const d=new Date(end); d.setDate(d.getDate()+1); return advWD(d,skip); }

// JT wants YYYY-MM-DD
function fmtJT(d){
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function fmtShort(d){ return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function fmtFull(d){  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }

// ─── Schedule computation ──────────────────────────────────────────────────────
function computeSchedule(projType, startStr, skip, overrides){
  if(!startStr) return [];
  const active   = TASK_DEFS.filter(t=>t.types.includes(projType));
  const activeSet = new Set(active.map(t=>t.id));

  function effDeps(task){
    const p=(task.deps||[]).filter(id=>activeSet.has(id));
    if(p.length>0) return p;
    return (task.altDeps||[]).filter(id=>activeSet.has(id));
  }

  const endDates={};
  const projStart=advWD(new Date(startStr+'T00:00:00'),skip);
  const result=[];

  for(const task of active){
    const deps=effDeps(task);
    let tStart;
    if(deps.length===0){
      tStart=new Date(projStart);
    } else {
      const maxEnd=deps.reduce((mx,id)=>{ const d=endDates[id]; return(!d||mx>d)?mx:d; },new Date(0));
      tStart=nextWD(maxEnd,skip);
    }
    const dur=overrides[task.id]!==undefined?overrides[task.id]:task.dur;
    const tEnd=addWD(tStart,dur,skip);
    endDates[task.id]=tEnd;
    result.push({...task,start:tStart,end:tEnd,dur,effDeps:deps});
  }
  return result;
}

    const map={},order=[];

    return order.map(g=>({group:g,tasks:map[g]}));
  },[schedule]);

  const totalDays=schedule.reduce((s,t)=>s+t.dur,0);
  const totalWks=Math.round(totalDays/5*10)/10;
  const projEnd=schedule.length?schedule[schedule.length-1].end:null;

  function setDur(id,val){ setDurOvr(prev=>({...prev,[id]:Math.max(1,parseInt(val)||1)})); }

  // ─── CSV Export ─────────────────────────────────────────────────────────────
  // Matches JT import format exactly:
  // Group, Name, Type, Target Type, Target ID, Description,
  // Start Date (YYYY-MM-DD), Start Time, End Date (YYYY-MM-DD), End Time,
  // Assignees, Depends On Tasks (task names separated by ; ), Subtasks, Progress
  function downloadCSV(){
    const hdr='Group,Name,Type,Target Type,Target ID,Description,Start Date,Start Time,End Date,End Time,Assignees,Depends On Tasks,Subtasks,Progress\n';
    let rows='', lastGroup='';

    schedule.forEach(t=>{
      // Emit group header row when group changes
      if(t.group!==lastGroup){
        rows+=`"${t.group}",,,"taskTemplate","${targetId}",,,,,,,,,\n`;
        lastGroup=t.group;
      }
      const desc=(t.description||'').replace(/"/g,'""');
      // Dependencies: use exact task names joined by '; '
      const deps=t.effDeps.map(id=>TASK_MAP[id]?.name||'').filter(Boolean).join('; ');
      rows+=`"${t.group}","${t.name}","${t.taskType}","taskTemplate","${targetId}","${desc}",${fmtJT(t.start)},,${fmtJT(t.end)},,,,"${deps}",,\n`;
    });

    const blob=new Blob([hdr+rows],{type:'text/csv'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    const safe=(projName.trim().replace(/\s+/g,'-')||'OVB-Schedule');
    a.download=`${safe} - Schedule - ${new Date().getFullYear()}.csv`;
    a.click(); URL.revokeObjectURL(url);
    setExpLabel('Downloaded ✓'); setTimeout(()=>setExpLabel('Export CSV'),2500);
  }

  // ─── Styles ──────────────────────────────────────────────────────────────────
  const C={
    bar:{ background:'#1E1C1A',padding:'12px 20px',display:'flex',alignItems:'center',justifyContent:'space-between',position:'sticky',top:0,zIndex:50 },
    card:{ background:'#fff',borderRadius:4,border:'1.5px solid #E4E0DB',padding:'16px 20px' },
    lbl:{ fontFamily:'DM Mono',fontSize:9,fontWeight:500,letterSpacing:'0.12em',textTransform:'uppercase',color:'#888480',display:'block',marginBottom:5 },
    pill:(on)=>({
      display:'inline-block',padding:'5px 12px',borderRadius:4,cursor:'pointer',
      border:`1.5px solid ${on?'#1E1C1A':'#E4E0DB'}`,background:on?'#1E1C1A':'#fff',
      color:on?'#C7AA8B':'#888480',fontFamily:'DM Mono',fontSize:11,fontWeight:500,
      transition:'all 0.1s',userSelect:'none',lineHeight:1,
    }),
    phHdr:{ background:'#1E1C1A',padding:'7px 16px',display:'flex',alignItems:'center',justifyContent:'space-between' },
    phLbl:{ fontFamily:'DM Mono',fontSize:10,fontWeight:500,letterSpacing:'0.1em',textTransform:'uppercase',color:'#C7AA8B' },
    tblHdr:{ display:'grid',gridTemplateColumns:'26px 1fr 100px 52px 70px 70px',gap:'0 8px',padding:'7px 16px',background:'#F7F5F2',borderBottom:'1.5px solid #E4E0DB' },
    row:(i,ins)=>({
      display:'grid',gridTemplateColumns:'26px 1fr 100px 52px 70px 70px',gap:'0 8px',
      padding:'8px 16px',alignItems:'center',borderBottom:'1px solid #F0EDE9',
      background:ins?'rgba(199,170,139,0.06)':(i%2===0?'#fff':'#FAFAF9'),
    }),
    mono:(sz,col)=>({fontFamily:'DM Mono',fontSize:sz,color:col}),
    typeBadge:{ fontFamily:'DM Mono',fontSize:9,color:'#888480',background:'#F0EDE9',padding:'2px 5px',borderRadius:3,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis' },
    bottom:{ position:'fixed',bottom:0,left:0,right:0,background:'#fff',borderTop:'1.5px solid #E4E0DB',padding:'10px 20px',display:'flex',alignItems:'center',justifyContent:'space-between',zIndex:50 },
    btn:(v)=>({ padding:'8px 18px',borderRadius:4,border:`1.5px solid ${v==='p'?'#1E1C1A':'#C7AA8B'}`,background:v==='p'?'#1E1C1A':'transparent',color:v==='p'?'#F7F7F7':'#C7AA8B',fontFamily:'DM Sans',fontSize:13,fontWeight:500,cursor:'pointer',transition:'all 0.1s' }),
  };

  let ri=0;

  return (
    <div>
      {/* Header */}
      <div style={C.bar} className="no-print">
        <div>
          <div style={{...C.mono(13,'#C7AA8B'),fontFamily:'DM Mono',fontWeight:500}}>📅 Schedule Builder</div>
          <div style={{...C.mono(10,'rgba(247,247,247,0.35)'),marginTop:2}}>JT Task Template → Dated Schedule</div>
        </div>
        <a href="/" style={{...C.mono(10,'rgba(199,170,139,0.5)'),textDecoration:'none',letterSpacing:'0.08em'}}>← Tools</a>
      </div>

      {/* Print header */}
      <div className="print-show" style={{padding:'14px 20px 10px',borderBottom:'2px solid #1E1C1A',marginBottom:10}}>
        <div style={{fontSize:16,fontWeight:600}}>{projName||'Project Schedule'}</div>
        <div style={{...C.mono(11,'#888480'),marginTop:3}}>
          {PROJECT_TYPES.find(p=>p.id===projType)?.label} · Start {startDate} · {totalDays} days ({totalWks} wks){projEnd?` · Est. Completion: ${fmtFull(projEnd)}`:''}
        </div>
      </div>

      <div style={{maxWidth:900,margin:'0 auto',padding:'16px 16px 0'}}>

        {/* Config card */}
        <div style={{...C.card,marginBottom:14}} className="no-print">
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(140px,1fr))',gap:14,marginBottom:14}}>
            <div>
              <span style={C.lbl}>Project Name</span>
              <input type="text" placeholder="123 Main St Addition" value={projName} onChange={e=>setProjName(e.target.value)} />
            </div>
            <div>
              <span style={C.lbl}>Start Date</span>
              <input type="date" value={startDate} onChange={e=>setStartDate(e.target.value)} />
            </div>
            <div>
              <span style={C.lbl}>JT Target ID</span>
              <input type="text" value={targetId} onChange={e=>setTargetId(e.target.value)} style={{fontFamily:'DM Mono',fontSize:12}} />
            </div>
            <div>
              <span style={C.lbl}>Skip Weekends</span>
              <div style={{display:'flex',gap:6,marginTop:1}}>
                {['Yes','No'].map(v=><span key={v} style={C.pill((v==='Yes')===skipWknd)} onClick={()=>setSkipWknd(v==='Yes')}>{v}</span>)}
              </div>
            </div>
          </div>
          <div>
            <span style={C.lbl}>Project Type</span>
            <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
              {PROJECT_TYPES.map(p=><span key={p.id} style={C.pill(projType===p.id)} onClick={()=>{setProjType(p.id);setDurOvr({});}}>{p.label}</span>)}
            </div>
          </div>
        </div>

        {/* Legend */}
        <div style={{display:'flex',gap:16,marginBottom:10,alignItems:'center'}} className="no-print">
          <div style={{display:'flex',alignItems:'center',gap:5}}>
            <div style={{width:10,height:10,borderRadius:2,background:'rgba(199,170,139,0.15)',border:'1px solid rgba(199,170,139,0.4)'}} />
            <span style={{...C.mono(9,'#888480'),letterSpacing:'0.08em',textTransform:'uppercase'}}>Inspection / Milestone</span>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:5}}>
            <div style={{width:6,height:6,borderRadius:'50%',background:'#C7AA8B'}} />
            <span style={{...C.mono(9,'#888480'),letterSpacing:'0.08em',textTransform:'uppercase'}}>Parallel Track</span>
          </div>
        </div>

        {/* Table */}
        <div style={{...C.card,padding:0,overflow:'hidden',marginBottom:14}}>
          <div style={C.tblHdr} className="no-print">
            {['#','Task','Type','Days','Start','End'].map((h,i)=>(
              <span key={h} style={{...C.lbl,margin:0,textAlign:i===3?'center':'left'}}>{h}</span>
            ))}
          </div>

          {grouped.map(({group,tasks})=>(
            <div key={group}>
              <div style={C.phHdr} className="phase-hdr">
                <span style={C.phLbl}>{group}</span>
                <span style={C.mono(9,'rgba(199,170,139,0.4)')}>{tasks.length} tasks</span>
              </div>
              {tasks.map((t,i)=>{
                const idx=ri++;
                return (
                  <div key={t.id} style={C.row(i,t.inspect)}>
                    {/* # */}
                    <span style={C.mono(10,'#C7C0B8')}>{idx+1}</span>
                    {/* Name */}
                    <div>
                      <div style={{display:'flex',alignItems:'flex-start',gap:5}}>
                        {t.parallel&&<div style={{width:5,height:5,borderRadius:'50%',background:'#C7AA8B',flexShrink:0,marginTop:5}}/>}
                        <span style={{fontSize:13,color:t.inspect?'#8A7560':'#1E1C1A',fontWeight:t.inspect?500:400}}>{t.name}</span>
                      </div>
                      {t.parallel&&<div style={{...C.mono(9,'#C7AA8B'),marginTop:2,marginLeft:10}}>{t.parallel}</div>}
                    </div>
                    {/* Task Type badge */}
                    <div style={C.typeBadge}>{t.taskType}</div>
                    {/* Days */}
                    <div style={{display:'flex',justifyContent:'center'}} className="no-print">
                      <input type="number" min="1" value={durOvr[t.id]!==undefined?durOvr[t.id]:t.dur} onChange={e=>setDur(t.id,e.target.value)} />
                    </div>
                    <span style={{...C.mono(11,'#888480'),display:'none'}} className="print-show">{t.dur}d</span>
                    {/* Dates */}
                    <span style={{...C.mono(11,'#888480'),whiteSpace:'nowrap'}}>{fmtShort(t.start)}</span>
                    <span style={{...C.mono(11,'#888480'),whiteSpace:'nowrap'}}>{fmtShort(t.end)}</span>
                  </div>
                );
              })}
            </div>
          ))}

          <div style={{padding:'10px 16px',background:'#FAFAF9',borderTop:'1px solid #F0EDE9'}}>
            <span style={C.mono(10,'#B0AAA4')}>
              MEP sequence: HVAC → Plumbing → Electrical → Low Voltage &nbsp;·&nbsp; Countertop fab (14d) runs parallel with trim, doors & flooring &nbsp;·&nbsp; Edit any duration — all downstream tasks cascade automatically &nbsp;·&nbsp; CSV exports YYYY-MM-DD dates + task types for JT import
            </span>
          </div>
        </div>

        {Object.keys(durOvr).length>0&&(
          <div style={{textAlign:'right',marginBottom:8}} className="no-print">
            <span style={{...C.mono(10,'#C7AA8B'),cursor:'pointer',textDecoration:'underline'}} onClick={()=>setDurOvr({})}>
              Reset all durations to defaults
            </span>
          </div>
        )}
      </div>

      {/* Bottom bar */}
      <div style={C.bottom} className="no-print">
        <div style={{display:'flex',alignItems:'center',gap:24}}>
          <div>
            <div style={{...C.mono(9,'#888480'),letterSpacing:'0.1em',textTransform:'uppercase'}}>Duration</div>
            <div style={{...C.mono(14,'#1E1C1A'),fontWeight:500,marginTop:2}}>
              {totalDays} days <span style={{color:'#C7AA8B',fontWeight:400}}>≈ {totalWks} wks</span>
            </div>
          </div>
          {projEnd&&(
            <div>
              <div style={{...C.mono(9,'#888480'),letterSpacing:'0.1em',textTransform:'uppercase'}}>Est. Completion</div>
              <div style={{...C.mono(14,'#1E1C1A'),fontWeight:500,marginTop:2}}>{fmtFull(projEnd)}</div>
            </div>
          )}
          <div>
            <div style={{...C.mono(9,'#888480'),letterSpacing:'0.1em',textTransform:'uppercase'}}>Tasks</div>
            <div style={{...C.mono(14,'#1E1C1A'),fontWeight:500,marginTop:2}}>{schedule.length}</div>
          </div>
        </div>
        <div style={{display:'flex',gap:8}}>
          <button style={C.btn('s')} onClick={()=>window.print()}>Print / PDF</button>
          <button style={C.btn('p')} onClick={downloadCSV}>{expLabel}</button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
